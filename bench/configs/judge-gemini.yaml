# Judge from a different model family than the Claude agents under test.
# Plan mode keeps the judge read-only; it runs in a fresh temp folder holding only the prompt,
# so --skip-trust is safe. The verdict is read from stdout.
name: gemini-judge
cmd: >-
  gemini --skip-trust --approval-mode plan -o text -p "Follow the instructions above." < {judge_prompt_file}
timeout: 300
